name: Validar catálogo AllFix

on:
  pull_request:
    paths:
      - catalog.json
      - requirements.json
      - about.json
      - eligibility.json
      - excluded-projects.json
      - schemas/**
      - scripts/**
      - tests/**
      - .github/workflows/validate-catalog.yml
  push:
    branches:
      - 'work/catalog-eligibility-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxe dos arquivos JSON
        run: |
          python -m json.tool catalog.json > /dev/null
          python -m json.tool requirements.json > /dev/null
          python -m json.tool about.json > /dev/null
          python -m json.tool eligibility.json > /dev/null
          python -m json.tool excluded-projects.json > /dev/null

      - name: Regressões de elegibilidade e datas
        run: python -m unittest discover -s tests -v

      - name: Validar schemas e referências
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/validate_catalog.py --require-dates --compare-with "$BASE_SHA"
          else
            python scripts/validate_catalog.py --require-dates --compare-with 44bdb508842407d501e420457274eb4064f5d935
          fi

      - name: Verificar espaços em branco no diff
        if: github.event_name == 'pull_request'
        run: git diff --check "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" HEAD
